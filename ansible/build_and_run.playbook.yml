- hosts: localhost
  gather_facts: false
  become: false
  vars:
    FILEPATH: src/shared/asyncArray.bench.js
    NUMBER_OF_LAUNCHES: 10
  tasks:
    - name: play
      include_tasks: "build_and_run.tasks.yml"
      loop: 
        - node
        - deno
        - bun
      loop_control:
        loop_var: RUNTIME_ENVIROMENT_NAME